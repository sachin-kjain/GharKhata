  function renderExpenseTab(cat){
    const f = ensureCatForm(cat.id);
    const month = monthOf(f.date || todayStr());
    const total = catExpenseTotal(cat.id, month);
    const rolling = usesRollingLedger(cat);
    const tracksPayment = cat.hasPaymentTracking === true && !rolling;
    const logMonth = f.logMonth || todayStr().slice(0,7);

    // Flatten {date: [entries]} into one row per entry, filtered to the selected log month
    const allDates = sortedDatesDesc(state.entries[cat.id] || {});
    const flatRows = [];
    allDates.forEach(d => {
      if(monthOf(d) !== logMonth) return;
      const dayList = state.entries[cat.id][d] || [];
      dayList.forEach(rec => flatRows.push({ date: d, rec }));
    });

    // Outstanding (unpaid) entries across ALL months, when payment tracking is on
    let outstanding = [], outstandingTotal = 0, overdueCount = 0;
    if(tracksPayment){
      allDates.forEach(d => {
        (state.entries[cat.id][d] || []).forEach(rec => {
          if(rec && !rec.paidDate) outstanding.push({ date: d, rec, status: billPaymentStatus(rec) });
        });
      });
      outstanding.sort((a,b) => {
        const ad = a.rec.dueDate || a.date, bd = b.rec.dueDate || b.date;
        return ad < bd ? -1 : 1;
      });
      outstandingTotal = outstanding.reduce((s,o) => s + (o.rec.amount||0), 0);
      overdueCount = outstanding.filter(o => o.status.key === 'overdue').length;
    }

    return `
    <div class="section">
      <div class="section-head">
        <span class="dot" style="background:${cat.color}"></span>
        <h2>${cat.icon} ${cat.name}</h2>
        <span class="month-total">${money(total)} this month</span>
      </div>

      ${rolling ? renderRollingBalanceCard(cat) : ''}

      ${tracksPayment && outstanding.length > 0 ? `
      <div class="card" style="border-color:${overdueCount > 0 ? 'var(--absent)' : 'var(--half)'}">
        <div class="section-head" style="margin-bottom:8px">
          <h2 style="font-size:14px">Unpaid</h2>
          <span class="month-total">${money(outstandingTotal)}${overdueCount > 0 ? ' · ' + overdueCount + ' overdue' : ''}</span>
        </div>
        <div class="log-list">
          ${outstanding.map(o => `
            <div class="log-row">
              <span class="log-date">${fmtDate(o.date)}</span>
              <span class="log-main">${money(o.rec.amount)}${o.rec.note ? ' &middot; ' + o.rec.note : ''}</span>
              <span class="log-chip" style="background:${o.status.color}">${o.status.label}</span>
              <div class="log-actions">
                <button class="icon-btn" onclick="gharCatMarkPaid('${cat.id}','${o.date}','${o.rec.id}')" title="Mark paid today">✓</button>
              </div>
            </div>`).join('')}
        </div>
      </div>` : ''}

      <div class="card">
        <div class="row">
          <div class="field">
            <label>Date</label>
            <input type="date" value="${f.date}" onchange="gharCatFormUpdate('${cat.id}','date', this.value)" />
          </div>
          <div class="field">
            <label>Amount (₹)</label>
            <input type="number" min="0" step="10" placeholder="e.g. 1200" value="${f.amount||''}" oninput="gharCatFormUpdate('${cat.id}','amount', this.value)" />
          </div>
        </div>
        ${cat.hasReferenceFields ? `
        <div class="field">
          <label>Service provider</label>
          <input type="text" placeholder="e.g. Adani Electricity" value="${f.provider||''}" oninput="gharCatFormUpdate('${cat.id}','provider', this.value)" />
        </div>
        <div class="row">
          <div class="field">
            <label>CA number</label>
            <input type="text" placeholder="e.g. 123456789" value="${f.caNumber||''}" oninput="gharCatFormUpdate('${cat.id}','caNumber', this.value)" />
          </div>
          <div class="field">
            <label>Meter number</label>
            <input type="text" placeholder="e.g. M-4567" value="${f.meterNumber||''}" oninput="gharCatFormUpdate('${cat.id}','meterNumber', this.value)" />
          </div>
        </div>` : ''}
        ${tracksPayment ? `
        <div class="row">
          <div class="field">
            <label>Due date (optional)</label>
            <input type="date" value="${f.dueDate||''}" onchange="gharCatFormUpdate('${cat.id}','dueDate', this.value)" />
          </div>
        </div>
        <div class="field">
          <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:normal;font-size:12px">
            <input type="checkbox" style="width:auto" ${f.paidDate?'checked':''} onchange="gharCatFormTogglePaid('${cat.id}', this.checked)" />
            Already paid
          </label>
        </div>
        ${f.paidDate ? `
        <div class="field">
          <label>Date paid</label>
          <input type="date" value="${f.paidDate}" onchange="gharCatFormUpdate('${cat.id}','paidDate', this.value)" />
        </div>` : ''}` : ''}
        <div class="field">
          <label>Note (optional)</label>
          <input type="text" placeholder="e.g. July electricity bill" value="${f.note||''}" oninput="gharCatFormUpdate('${cat.id}','note', this.value)" />
        </div>
        ${cat.hasBillImage ? `<div class="type-note" style="margin-bottom:8px">Bill photo capture is available in the mobile app.</div>` : ''}
        ${f.editId ? `
        <div class="row">
          <button class="btn btn-primary" style="flex:2" onclick="gharCatEntrySave('${cat.id}')">Update entry</button>
          <button class="btn btn-ghost" style="flex:1" onclick="gharCatEntryCancelEdit('${cat.id}')">Cancel</button>
        </div>` : `
        <button class="btn btn-primary" onclick="gharCatEntrySave('${cat.id}')">Save entry</button>`}
      </div>

      <div class="section-head" style="margin-top:14px;margin-bottom:0">
        <h2 style="font-size:14px">Entries</h2>
        <input type="month" style="margin-left:auto;max-width:150px" value="${logMonth}" onchange="gharCatLogMonthChange('${cat.id}', this.value)" />
      </div>
      <div class="log-list" style="margin-top:8px">
        ${flatRows.length === 0 ? `<div class="empty-msg">No entries in ${fmtMonthLabel(logMonth)}</div>` :
          flatRows.map(({date:d, rec}) => {
            const refParts = [];
            if(cat.hasReferenceFields){
              if(rec.provider) refParts.push(rec.provider);
              if(rec.caNumber) refParts.push('CA ' + rec.caNumber);
              if(rec.meterNumber) refParts.push('Meter ' + rec.meterNumber);
            }
            const mainText = money(rec.amount) + (rec.note ? ' &middot; ' + rec.note : '') + (refParts.length ? ' &middot; ' + refParts.join(' &middot; ') : '');
            const status = tracksPayment ? billPaymentStatus(rec) : null;
            return `
            <div class="log-row">
              <span class="log-date">${fmtDate(d)}</span>
              <span class="log-main">${mainText}</span>
              ${status ? `<span class="log-chip" style="background:${status.color}">${status.label}</span>` : ''}
              <div class="log-actions">
                ${tracksPayment ? (rec.paidDate
                  ? `<button class="icon-btn" onclick="gharCatMarkUnpaid('${cat.id}','${d}','${rec.id}')" title="Mark unpaid">↺</button>`
                  : `<button class="icon-btn" onclick="gharCatMarkPaid('${cat.id}','${d}','${rec.id}')" title="Mark paid today">✓</button>`) : ''}
                <button class="icon-btn" onclick="gharCatEntryEdit('${cat.id}','${d}','${rec.id}')" title="Edit">✎</button>
                <button class="icon-btn" onclick="gharCatEntryDelete('${cat.id}','${d}','${rec.id}')" title="Delete">✕</button>
              </div>
            </div>`;
          }).join('')
        }
      </div>
      ${cat.bonusApplicable ? renderBonusCard(cat.id, cat.name) : ''}
    </div>`;
  }

  // Per-staff tab: attendance, duty hours/OT, leave policy, advances and salary — all scoped to ONE person.
  function renderStaffPerson(staffObj){
    const name = staffObj.name;
    // Attendance dates that mention this staff member
    const dates = sortedDatesDesc(state.attendance).filter(d => state.attendance[d] && state.attendance[d][name] !== undefined);
    const p = getLeavePolicy(name);
    const isWO = isWeeklyOffDate(name, staffForm.date);
    const cur = staffForm.statuses[name] || (isWO ? 'WO' : 'P');
    const plLabel = leavePolicyLabel(name);
    const h = (staffForm.hours || {})[name] || { in:'', out:'' };
    const workedH = (h.in && h.out) ? (function(){
      const a = parseHHMM(h.in), b = parseHHMM(h.out);
      if(a===null||b===null) return null;
      let m = b - a; if(m < 0) m += 1440;
      return m/60;
    })() : null;
    const otH = (workedH !== null && workedH > p.shiftHours) ? (workedH - p.shiftHours) : 0;

    return `
    <div class="section">
      <div class="section-head">
        <span class="dot" style="background:${staffObj.color}"></span>
        <h2>${staffObj.icon} ${name}</h2>
      </div>
      <div class="card">
        <div class="field">
          <label>Date</label>
          <input type="date" value="${staffForm.date}" onchange="gharStaffDateChange(this.value)" />
        </div>
        <div class="staff-row" style="flex-direction:column;align-items:stretch;gap:6px;border-bottom:none;padding:0">
          <div style="display:flex;align-items:center;gap:10px">
            <span class="staff-name" style="flex:none">${plLabel ? `<span style="font-size:10px;font-weight:500;color:var(--ink-soft)">${plLabel}</span>` : ''}</span>
            <div class="status-toggle">
              ${isWO ? `<button class="${cur==='WO'?'active-WO':''}" onclick="gharStaffSetStatus('${name}','WO')">WO</button>` : ''}
              <button class="${cur==='P'?'active-P':''}" onclick="gharStaffSetStatus('${name}','P')">P</button>
              <button class="${cur==='A'?'active-A':''}" onclick="gharStaffSetStatus('${name}','A')">A</button>
              <button class="${cur==='H'?'active-H':''}" onclick="gharStaffSetStatus('${name}','H')">H</button>
              ${isWO ? '' : `<button class="${cur==='PL'?'active-PL':''}" onclick="gharStaffSetStatus('${name}','PL')">PL</button>`}
            </div>
          </div>
          ${isWO && cur==='P' ? `<div style="font-size:11px;color:var(--gold);font-weight:600">Worked on weekly off — ${p.woComp==='money' ? 'extra pay ' + money(p.woRate) : 'earns 1 comp-off'}</div>` : ''}
          ${p.tracksHours ? (
            (p.clockMode && staffForm.date === todayStr()) ? `
            <div class="row" style="align-items:center;flex-wrap:wrap;gap:10px;margin-top:4px">
              <button type="button" class="btn ${(h.in && !h.out) ? 'btn-danger' : 'btn-primary'}" style="flex:0 0 auto" onclick="gharClockAction('${name}')">
                ${!h.in ? '🕐 Check In' : (h.in && !h.out ? '🕐 Check Out' : '🕐 Check In again')}
              </button>
              <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft)">
                ${h.in ? 'In ' + h.in : 'Not checked in yet'}${h.in && h.out ? ' &middot; Out ' + h.out : ''}
                ${workedH !== null ? '<br>' + workedH.toFixed(1) + 'h' + (otH > 0 ? ' <span style="color:var(--gold);font-weight:600">+OT ' + otH.toFixed(1) + 'h</span>' : '') : ''}
              </div>
            </div>` : `
            <div class="row" style="align-items:flex-end">
              <div class="field" style="margin-bottom:0">
                <label>In</label>
                <input type="time" value="${h.in}" onchange="gharDutyHoursUpdate('${name}','in', this.value); render()" />
              </div>
              <div class="field" style="margin-bottom:0">
                <label>Out</label>
                <input type="time" value="${h.out}" onchange="gharDutyHoursUpdate('${name}','out', this.value); render()" />
              </div>
              <div style="flex:0 0 84px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);padding-bottom:9px">
                ${workedH === null ? '—' : workedH.toFixed(1) + 'h' + (otH > 0 ? `<br><span style="color:var(--gold);font-weight:600">OT ${otH.toFixed(1)}h</span>` : '')}
              </div>
            </div>`
          ) : ''}
        </div>
        <button class="btn btn-primary" style="margin-top:10px" onclick="gharStaffSave()">Save attendance</button>
      </div>

      <div class="log-list">
        ${dates.length === 0 ? '<div class="empty-msg">No attendance recorded yet</div>' :
          dates.slice(0,31).map(d => {
            const status = state.attendance[d][name];
            const workedWO = (status === 'P' && isWeeklyOffDate(name, d));
            const hh = dayWorkedHours(name, d);
            const ot = (hh !== null && hh > p.shiftHours) ? (hh - p.shiftHours) : 0;
            const isAuto = !!(state.autoAttendance[name] && state.autoAttendance[name][d]);
            return `
            <div class="log-row">
              <span class="log-date">${fmtDate(d)}</span>
              <span class="a-chip" style="background:${STATUS_COLOR[status]}">${status}${workedWO ? ' (WO worked)' : ''}${hh !== null ? ' · ' + hh.toFixed(1) + 'h' + (ot > 0 ? ' +OT' + ot.toFixed(1) : '') : ''}</span>
              ${isAuto ? `<span class="log-chip" style="background:var(--ink-soft)">Auto</span>` : ''}
              <div class="log-actions">
                <button class="icon-btn" onclick="gharAttendanceEdit('${d}')" title="Edit">✎</button>
                <button class="icon-btn" onclick="gharAttendanceDelete('${d}','${name}')" title="Delete">✕</button>
              </div>
            </div>`;
          }).join('')
        }
      </div>
      ${renderStaffAdvanceCard(staffObj)}
      ${renderStaffSettlementCard(staffObj)}
      ${staffObj.bonusApplicable ? renderStaffBonusCard(staffObj) : ''}
    </div>`;
  }

  function renderMonthly(){
    const f = accountsFilter;
    const isStaffFilter = (f === 'group:staff' || f.indexOf('staff:') === 0);
    const isUtilSub = f.indexOf('utilsub:') === 0;
    const showCatsSection = !isStaffFilter;
    const showStaffSection = (f === 'all' || isStaffFilter);
    const filterLabel = accountsFilterLabel();

    let catSummaries = [];
    if(isUtilSub){
      const utilCat = getCat('utility');
      const st = utilCat ? getUtilitySubtype(utilCat, f.slice(8)) : null;
      if(st){
        const gross = utilitySubtypeMonthTotal(st.id, summaryMonth);
        catSummaries = [{ cat: { icon: st.icon||'🧾', name: st.name, type:'expense' }, gross, advance:0, net: gross }];
      }
    } else if(showCatsSection){
      let cats = state.categories.filter(c => c.type !== 'attendance');
      if(f.indexOf('cat:') === 0) cats = cats.filter(c => c.id === f.slice(4));
      else if(f === 'group:daily') cats = cats.filter(c => c.serviceKind === 'daily');
      else if(f === 'group:adhoc') cats = cats.filter(c => c.serviceKind === 'adhoc');
      else if(f === 'group:utility') cats = cats.filter(c => c.type === 'utilitygroup');
      catSummaries = cats.map(c => Object.assign({cat:c}, computeCategorySummary(c.id, summaryMonth)));
    }

    let filteredStaff = [];
    if(showStaffSection){
      filteredStaff = f.indexOf('staff:') === 0 ? state.staff.filter(s => s.name === f.slice(6)) : state.staff;
    }
    const attCounts = monthAttendanceCounts(summaryMonth);
    const r = state.rates;
    const advanceB = monthAdjustmentBreakdown(summaryMonth);
    const staffGross = filteredStaff.reduce((s,st) => s + (r.staffSalary[st.name]||0), 0);
    const staffAdvance = filteredStaff.reduce((s,st) => s + (advanceB[st.name]||0), 0);
    const staffWoPay = filteredStaff.reduce((s,st) => s + staffExtras(st.name, summaryMonth, false).woPay, 0);
    const staffOtPay = filteredStaff.reduce((s,st) => s + staffExtras(st.name, summaryMonth, false).ot.otAmount, 0);
    const staffNet = staffGross - staffAdvance + staffWoPay + staffOtPay;
    const grandTotal = catSummaries.reduce((s,x)=>s+x.net,0) + (showStaffSection ? staffNet : 0);

    return `
    <div class="section">
      <div class="section-head">
        <span class="dot" style="background:var(--gold)"></span>
        <h2>Monthly Summary</h2>
      </div>
      <div class="card">
        <div class="row">
          <div class="field">
            <label>Month</label>
            <input type="month" value="${summaryMonth}" onchange="gharSummaryMonthChange(this.value)" />
          </div>
          ${renderAccountsFilterControl()}
        </div>
        <div style="font-size:12px;color:var(--ink-soft)">${fmtMonthLabel(summaryMonth)}${filterLabel ? ' &middot; ' + filterLabel : ''}</div>
      </div>

      <div class="summary-grid">
        ${catSummaries.map(x => `
          <div class="stat-card">
            <div class="stat-label">${x.cat.icon} ${x.cat.name}${(x.cat.type==='expense'||x.cat.type==='utilitygroup') ? '' : ' (net)'}</div>
            <div class="stat-value" style="font-size:16px">${money(x.net)}</div>
            <div style="font-size:11px;color:var(--ink-soft);margin-top:2px">${(x.cat.type==='expense'||x.cat.type==='utilitygroup') ? 'Total this month' : 'Adv ' + money(x.advance)}</div>
          </div>`).join('')}
        ${showStaffSection ? `
        <div class="stat-card">
          <div class="stat-label">🧹 Staff salary (net)</div>
          <div class="stat-value" style="font-size:16px">${money(staffNet)}</div>
          <div style="font-size:11px;color:var(--ink-soft);margin-top:2px">Gross ${money(staffGross)} &middot; Adv ${money(staffAdvance)}</div>
        </div>` : ''}
      </div>

      <div class="card" style="margin-top:12px; border-color:var(--gold)">
        <div class="section-head" style="margin-bottom:4px">
          <h2 style="font-size:14px">Total payable — ${fmtMonthLabel(summaryMonth)}${filterLabel ? ' (' + filterLabel + ')' : ''}</h2>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-soft)">
          ${catSummaries.map(x => {
            const c = x.cat;
            let label;
            if(c.type === 'quantity') label = `${c.name} (${catQuantityTotal(c.id, summaryMonth).toFixed(2)} ${c.unit||'unit'} × ₹${(r.quantityRates||{})[c.id]||0})`;
            else if(c.type === 'multiitem') label = `${c.name} (${catMultiItemTotalCount(c.id, summaryMonth)} pcs)`;
            else label = `${c.name} (bill total)`;
            return `
            <div style="display:flex;justify-content:space-between"><span>${label}</span><span>${money(x.gross)}</span></div>
            ${(c.type !== 'expense' && c.type !== 'utilitygroup') ? `<div style="display:flex;justify-content:space-between"><span>&nbsp;&nbsp;less advance adjusted</span><span>− ${money(x.advance)}</span></div>` : ''}`;
          }).join('')}
          ${showStaffSection ? `
          <div style="display:flex;justify-content:space-between"><span>Staff salary (gross)</span><span>${money(staffGross)}</span></div>
          ${staffWoPay > 0 ? `<div style="display:flex;justify-content:space-between"><span>&nbsp;&nbsp;plus weekly offs worked</span><span>+ ${money(staffWoPay)}</span></div>` : ''}
          ${staffOtPay > 0 ? `<div style="display:flex;justify-content:space-between"><span>&nbsp;&nbsp;plus overtime</span><span>+ ${money(staffOtPay)}</span></div>` : ''}
          <div style="display:flex;justify-content:space-between"><span>&nbsp;&nbsp;less advance adjusted</span><span>− ${money(staffAdvance)}</span></div>` : ''}
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px dashed var(--page-line);font-weight:700;font-size:16px;font-family:'IBM Plex Mono',monospace">

            </div>`;

  function renderYearly(){
    const year = yearlySelected;
    const f = accountsFilter;
    const isStaffFilter = (f === 'group:staff' || f.indexOf('staff:') === 0);
    const isUtilSub = f.indexOf('utilsub:') === 0;
    const showCatsSection = !isStaffFilter;
    const showStaffSection = (f === 'all' || isStaffFilter);
    const filterLabel = accountsFilterLabel();
    const r = state.rates;

    let catSummaries = [];
    if(isUtilSub){
      const utilCat = getCat('utility');
      const st = utilCat ? getUtilitySubtype(utilCat, f.slice(8)) : null;
      if(st){
        const gross = utilitySubtypeYearTotal(st.id, year);
        catSummaries = [{ cat: { icon: st.icon||'🧾', name: st.name, type:'expense' }, gross, advance:0, net: gross }];
      }
    } else if(showCatsSection){
      let cats = state.categories.filter(c => c.type !== 'attendance');
      if(f.indexOf('cat:') === 0) cats = cats.filter(c => c.id === f.slice(4));
      else if(f === 'group:daily') cats = cats.filter(c => c.serviceKind === 'daily');
      else if(f === 'group:adhoc') cats = cats.filter(c => c.serviceKind === 'adhoc');
      else if(f === 'group:utility') cats = cats.filter(c => c.type === 'utilitygroup');
      catSummaries = cats.map(c => Object.assign({cat:c}, computeCategorySummaryYear(c.id, year)));
    }

    let filteredStaff = [];
    if(showStaffSection){
      filteredStaff = f.indexOf('staff:') === 0 ? state.staff.filter(s => s.name === f.slice(6)) : state.staff;
    }
    const staffMonthly = filteredStaff.reduce((s,st) => s + (r.staffSalary[st.name]||0), 0);
    const staffGross = staffMonthly * 12;
    const filteredStaffNames = filteredStaff.map(s => s.name);
    const staffAdvance = state.advanceSettlements
      .filter(s => s.type === 'adjustment' && s.category === 'staff' && s.date.slice(0,4) === year && filteredStaffNames.includes(s.staff))
      .reduce((s,x) => s + x.amount, 0);
    const staffWoPay = filteredStaff.reduce((s,st) => s + staffExtras(st.name, year, true).woPay, 0);
    const staffOtPay = filteredStaff.reduce((s,st) => s + staffExtras(st.name, year, true).ot.otAmount, 0);
    const staffNet = staffGross - staffAdvance + staffWoPay + staffOtPay;
    const grandTotal = catSummaries.reduce((s,x)=>s+x.net,0) + (showStaffSection ? staffNet : 0);
    const attCounts = yearAttendanceCounts(year);

    return `
    <div class="section">
      <div class="section-head">
        <span class="dot" style="background:var(--gold)"></span>
        <h2>Yearly Summary</h2>
      </div>
      <div class="card">
        <div class="row">
          <div class="field">
            <label>Year</label>
            <input type="number" min="2000" max="2100" step="1" value="${year}" onchange="gharYearlyYearChange(this.value)" />
          </div>
          ${renderAccountsFilterControl()}
        </div>
        ${filterLabel ? `<div style="font-size:12px;color:var(--ink-soft)">${filterLabel}</div>` : ''}
      </div>

      <div class="summary-grid">
        ${catSummaries.map(x => `
          <div class="stat-card">
            <div class="stat-label">${x.cat.icon} ${x.cat.name}${(x.cat.type==='expense'||x.cat.type==='utilitygroup') ? '' : ' (net)'}</div>
            <div class="stat-value" style="font-size:16px">${money(x.net)}</div>
            <div style="font-size:11px;color:var(--ink-soft);margin-top:2px">${(x.cat.type==='expense'||x.cat.type==='utilitygroup') ? 'Total this year' : 'Adv ' + money(x.advance)}</div>
          </div>`).join('')}
        ${showStaffSection ? `
        <div class="stat-card">
          <div class="stat-label">🧹 Staff salary (net)</div>
          <div class="stat-value" style="font-size:16px">${money(staffNet)}</div>
          <div style="font-size:11px;color:var(--ink-soft);margin-top:2px">Gross ${money(staffGross)} &middot; Adv ${money(staffAdvance)}</div>
        </div>` : ''}
      </div>

      <div class="card" style="margin-top:12px; border-color:var(--gold)">
        <div class="section-head" style="margin-bottom:4px">
          <h2 style="font-size:14px">Total payable — ${year}${filterLabel ? ' (' + filterLabel + ')' : ''}</h2>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-soft)">
          ${catSummaries.map(x => {
            const c = x.cat;
            let label;
            if(c.type === 'quantity') label = `${c.name} (${catQuantityTotalYear(c.id, year).toFixed(2)} ${c.unit||'unit'} × ₹${(r.quantityRates||{})[c.id]||0})`;
            else if(c.type === 'multiitem') label = `${c.name} (${catMultiItemTotalCountYear(c.id, year)} pcs)`;
            else label = `${c.name} (bill total)`;
            return `
            <div style="display:flex;justify-content:space-between"><span>${label}</span><span>${money(x.gross)}</span></div>
            ${(c.type !== 'expense' && c.type !== 'utilitygroup') ? `<div style="display:flex;justify-content:space-between"><span>&nbsp;&nbsp;less advance adjusted</span><span>− ${money(x.advance)}</span></div>` : ''}`;
          }).join('')}
          ${showStaffSection ? `
          <div style="display:flex;justify-content:space-between"><span>Staff salary (₹${staffMonthly}/mo × 12)</span><span>${money(staffGross)}</span></div>
          ${staffWoPay > 0 ? `<div style="display:flex;justify-content:space-between"><span>&nbsp;&nbsp;plus weekly offs worked</span><span>+ ${money(staffWoPay)}</span></div>` : ''}
          ${staffOtPay > 0 ? `<div style="display:flex;justify-content:space-between"><span>&nbsp;&nbsp;plus overtime</span><span>+ ${money(staffOtPay)}</span></div>` : ''}
          <div style="display:flex;justify-content:space-between"><span>&nbsp;&nbsp;less advance adjusted</span><span>− ${money(staffAdvance)}</span></div>` : ''}
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px dashed var(--page-line);font-weight:700;font-size:16px;font-family:'IBM Plex Mono',monospace">
          <span>${filterLabel ? 'Total' : 'Grand total'}</span><span>${money(grandTotal)}</span>
        </div>
      </div>

      ${showStaffSection ? `
      <div class="card" style="margin-top:12px">
        <div class="section-head" style="margin-bottom:8px">
          <h2 style="font-size:14px">Attendance — ${year}</h2>
        </div>
        ${filteredStaff.length === 0 ? '<div class="empty-msg">No staff added</div>' :
          filteredStaff.map(st => {
            const name = st.name;
            const c = attCounts[name] || {P:0,A:0,H:0,PL:0,WO:0};
            const ex = staffExtras(name, year, true);
            return `
            <div class="staff-row">
              <span class="staff-name">${st.icon} ${name}</span>
              <div class="attendance-chips">
                <span class="a-chip" style="background:var(--present)">P: ${c.P}</span>
                <span class="a-chip" style="background:var(--absent)">A: ${c.A}</span>
                <span class="a-chip" style="background:var(--half)">H: ${c.H}</span>
                <span class="a-chip" style="background:var(--leave)">PL: ${c.PL}</span>
                ${ex.policy.type==='weekly' ? `<span class="a-chip" style="background:var(--ink-soft)">WO worked: ${ex.woWorked}</span>` : ''}
                ${ex.policy.tracksHours ? `<span class="a-chip" style="background:var(--gold)">OT: ${ex.ot.otHours.toFixed(1)}h</span>` : ''}
              </div>
            </div>`;
          }).join('')
        }
      </div>` : ''}
    </div>`;
  }

          <div class="status-toggle">
            <button class="${nc.paymentFrequency==='monthly'?'active-P':''}" onclick="gharNewCatSetPaymentFrequency('monthly')">Monthly</button>
            <button class="${nc.paymentFrequency==='adhoc'?'active-P':''}" onclick="gharNewCatSetPaymentFrequency('adhoc')">Every N days</button>
          </div>
        </div>
        ${nc.paymentFrequency === 'monthly' ? `<div class="type-note" style="margin-bottom:0">Settled once a month — tracked in Monthly/Yearly Accounts, same as Milk and Iron today.</div>` : `
        <div class="field" style="margin-bottom:0">
          <label>Settle up every how many days?</label>
          <input type="number" min="1" step="1" value="${nc.paymentFrequencyDays}" oninput="gharNewCatUpdate('paymentFrequencyDays', this.value)" />
        </div>
        <div class="type-note" style="margin-top:6px;margin-bottom:0">Entries add up into a running balance on this service's own page. Pay it off whenever — full or partial — and the rest carries forward.</div>`}
      </div>` : ''}

      ${isAdhoc ? `
      <div class="card">
        <div class="field">
          <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:normal;font-size:12px">
            <input type="checkbox" style="width:auto" ${nc.refFields?'checked':''} onchange="gharNewCatToggleRefFields(this.checked)" />
            Include Service Provider / CA number / Meter number fields
          </label>
        </div>
      </div>` : ''}

      <div class="card">
        <div class="field">
          <label>Name</label>
          <input type="text" placeholder="e.g. Dryclean, Rent, Plumber" value="${nc.name}" oninput="gharNewCatUpdate('name', this.value)" />
        </div>
        <div class="row">
          <div class="field">
            <label>Icon</label>
            <input type="text" maxlength="4" placeholder="🧺" value="${nc.icon}" oninput="gharNewCatUpdate('icon', this.value)" />
          </div>
          <div class="field">
            <label>Color</label>
            <div class="swatch-row" style="padding-top:6px">
              ${PALETTE.map(c => `<button type="button" class="swatch ${nc.color===c?'selected':''}" style="background:${c}" onclick="gharNewCatUpdate('color','${c}')"></button>`).join('')}
            </div>
          </div>
        </div>
        <div class="icon-quick-row">
          ${QUICK_ICONS.map(ic => `<button type="button" class="btn btn-ghost btn-small" onclick="gharNewCatUpdate('icon','${ic}')">${ic}</button>`).join('')}
        </div>
        ${(!isAdhoc && nc.type === 'quantity') ? `
        <div class="field">
          <label>Unit label (e.g. litre, kg, visit)</label>
          <input type="text" placeholder="e.g. litre" value="${nc.unit}" oninput="gharNewCatUpdate('unit', this.value)" />
        </div>` : ''}
        ${(!isAdhoc && nc.type === 'multiitem') ? `
        <div class="field">
          <label>Item types</label>
          <div class="row">
            <div class="field" style="margin-bottom:0">
              <input type="text" placeholder="e.g. Shirt, Trouser, Suit" value="${nc.newItemName}" oninput="gharNewCatUpdate('newItemName', this.value)" />
            </div>
            <button class="btn btn-ghost btn-small" onclick="gharNewCatAddItem()">Add item</button>
          </div>
          <div class="staff-chip-row">
            ${nc.items.map((n,idx) => `<span class="staff-chip">${n} <button onclick="gharNewCatRemoveItem(${idx})">✕</button></span>`).join('')}
          </div>
        </div>
        <div class="field">
          <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:normal;font-size:12px">
            <input type="checkbox" style="width:auto" ${nc.deliveryStatus?'checked':''} onchange="gharNewCatUpdate('deliveryStatus', this.checked)" />
            Track handover &amp; return (e.g. laundry — items go out, come back later, may return partially)
          </label>
        </div>` : ''}
        <button class="btn btn-primary" style="margin-top:6px" onclick="gharAddCategory()">Add service</button>
      </div>
    </div>`;
  }

  function renderUtilitySubtypeSettingsPage(subtypeId){
    const cat = getCat('utility');
    const st = cat ? getUtilitySubtype(cat, subtypeId) : null;
    if(!st) return renderSettingsHub();
    const caLabel = st.caNumberLabel || 'CA number';
    const meterLabel = st.meterNumberLabel || 'Meter number';
    return `
    <div class="section">
      ${settingsBackBar((st.icon||'🧾') + ' ' + st.name)}
      <div class="card">
        <div class="row">
          <div class="field" style="max-width:70px">
            <label>Icon</label>
            <input type="text" maxlength="4" value="${st.icon||''}" onchange="gharUtilitySubtypeFieldUpdate('${cat.id}','${st.id}','icon', this.value)" />
          </div>
          <div class="field">
            <label>Name</label>
            <input type="text" value="${st.name}" onchange="gharUtilitySubtypeFieldUpdate('${cat.id}','${st.id}','name', this.value)" />
          </div>
        </div>
        <div class="icon-quick-row">
          ${QUICK_ICONS.map(ic => `<button type="button" class="btn btn-ghost btn-small" onclick="gharUtilitySubtypeFieldUpdate('${cat.id}','${st.id}','icon','${ic}')">${ic}</button>`).join('')}
        </div>
        <div class="field">
          <label>Service provider</label>
          <input type="text" placeholder="e.g. Adani Electricity" value="${st.provider||''}" onchange="gharUtilitySubtypeFieldUpdate('${cat.id}','${st.id}','provider', this.value)" />
        </div>
        <div class="type-note">Not every provider uses the same reference numbers — rename these two fields to match, or leave one blank if this provider doesn't have one.</div>
        <div class="row">
          <div class="field" style="margin-bottom:0">
            <label>Field 1 label</label>
            <input type="text" placeholder="e.g. CA Number, Consumer ID" value="${caLabel}" onchange="gharUtilitySubtypeFieldUpdate('${cat.id}','${st.id}','caNumberLabel', this.value)" />
          </div>
          <div class="field" style="margin-bottom:0">
            <label>${caLabel} value</label>
            <input type="text" placeholder="e.g. 123456789" value="${st.caNumber||''}" onchange="gharUtilitySubtypeFieldUpdate('${cat.id}','${st.id}','caNumber', this.value)" />
          </div>
        </div>
        <div class="row" style="margin-top:8px">
          <div class="field" style="margin-bottom:0">
            <label>Field 2 label</label>
            <input type="text" placeholder="e.g. Meter Number, Account No." value="${meterLabel}" onchange="gharUtilitySubtypeFieldUpdate('${cat.id}','${st.id}','meterNumberLabel', this.value)" />
          </div>
          <div class="field" style="margin-bottom:0">
            <label>${meterLabel} value</label>
            <input type="text" placeholder="e.g. M-4567" value="${st.meterNumber||''}" onchange="gharUtilitySubtypeFieldUpdate('${cat.id}','${st.id}','meterNumber', this.value)" />
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:10px">
          <button class="btn btn-small btn-danger" onclick="gharUtilityRemoveSubtype('${cat.id}','${st.id}')">Remove ${st.name}</button>
        </div>
      </div>
    </div>`;
  }

  function renderAddUtilityPage(){
    const catId = 'utility';
    const val = (settingsState.utilityNewSubtype && settingsState.utilityNewSubtype[catId]) || '';
    return `
    <div class="section">
      ${settingsBackBar('Add a new utility')}
      <div class="card">
        <div class="type-note">e.g. Water, Broadband, Maintenance. You can set its icon and provider details right after.</div>
        <div class="field">
          <label>Name</label>
          <input type="text" placeholder="e.g. Water" value="${val}" oninput="gharUtilityAddSubtypeNameUpdate('${catId}', this.value)" />
        </div>
        <button class="btn btn-primary" onclick="gharUtilityAddSubtype('${catId}')">Add utility</button>
      </div>
    </div>`;
  }

  function renderStaffSettingsPage(staffId){
    const s = state.staff.find(x => x.id === staffId);
    if(!s) return renderSettingsHub();
    const r = state.rates;
    return `
    <div class="section">
      ${settingsBackBar(s.icon + ' ' + s.name)}
      <div class="card">
        <div class="row">
          <div class="field" style="max-width:70px">
            <label>Icon</label>
            <input type="text" maxlength="4" value="${s.icon}" onchange="gharStaffFieldUpdate('${s.id}','icon', this.value)" />
          </div>
          <div class="field">
            <label>Name</label>
            <input type="text" value="${s.name}" onchange="gharStaffFieldUpdate('${s.id}','name', this.value)" />
          </div>
        </div>
        <div class="field" style="margin-bottom:0">
          <label>Color</label>
          <div class="swatch-row">
            ${PALETTE.concat([s.color]).filter((c,i,a) => a.indexOf(c) === i).map(c => `<button type="button" class="swatch ${s.color===c?'selected':''}" style="background:${c}" onclick="gharStaffFieldUpdate('${s.id}','color','${c}')"></button>`).join('')}
          </div>
        </div>
        <div class="icon-quick-row" style="margin-top:8px;margin-bottom:0">
          ${STAFF_ICONS.map(ic => `<button type="button" class="btn btn-ghost btn-small" onclick="gharStaffFieldUpdate('${s.id}','icon','${ic}')">${ic}</button>`).join('')}
        </div>
        <div class="field" style="margin-top:10px;margin-bottom:0">
          <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:normal;font-size:12px">
            <input type="checkbox" style="width:auto" ${s.bonusApplicable?'checked':''} onchange="gharStaffFieldUpdate('${s.id}','bonusApplicable', this.checked)" />
            Bonus applicable
          </label>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:10px">
          <button class="btn btn-small btn-danger" onclick="gharRemoveStaff('${s.id}')">Remove ${s.name}</button>
        </div>
      </div>

      <div class="card">
        <div class="section-head" style="margin-bottom:8px">
          <h2 style="font-size:14px">Monthly salary</h2>
        </div>
        <div class="field" style="margin-bottom:0">
          <label>${s.name} (₹ / month)</label>
          <input type="number" min="0" step="100" value="${r.staffSalary[s.name] || 0}" onchange="gharStaffSalaryUpdate('${s.name}', this.value)" />
        </div>
      </div>

      ${renderLeavePolicyCard(s)}

      <div class="type-note" style="padding:0 2px">Attendance and duty hours are logged from ${s.name}'s own tab on Home.</div>
    </div>`;
  }

  function renderAddStaffPage(){
    return `
    <div class="section">
      ${settingsBackBar('Add staff member')}
      <div class="card">
        <div class="field">
          <label>Name</label>
          <input type="text" placeholder="e.g. Cook" value="${newStaffName}" oninput="gharNewStaffNameUpdate(this.value)" />
        </div>
        <button class="btn btn-primary" onclick="gharAddStaff()">Add staff</button>
      </div>
    </div>`;
  }

  function renderSettings(){
    const sel = settingsState.selected;
    if(!sel) return renderSettingsHub();
    if(sel.type === 'category') return renderCategorySettingsPage(getCat(sel.id));
    if(sel.type === 'addCategory') return renderAddCategoryPage();
    if(sel.type === 'utilitySubtype') return renderUtilitySubtypeSettingsPage(sel.id);
    if(sel.type === 'addUtility') return renderAddUtilityPage();
    if(sel.type === 'staff') return renderStaffSettingsPage(sel.id);
    if(sel.type === 'addStaff') return renderAddStaffPage();
    return renderSettingsHub();
  }


  // init
  staffForm.statuses = {};
  staffForm.hours = {};
  loadAll();
})();
</script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(e){
        console.warn('Service worker registration failed', e);
      });
    });
  }
</script>
</body>
</html>
