<!-- Ghar Khata: household vendor & staff tracker (offline PWA build) -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --cover:#4E7690;
    --cover-dark:#345465;
    --page:#F3ECDD;
    --page-line:#E2D6C0;
    --ink:#2E3D46;
    --ink-soft:#66767E;
    --gold:#2F6F8F;
    --milk:#3E6FA8;
    --iron:#6E6A5E;
    --nariyal:#3B7A55;
    --staff:#B07A1E;
    --absent:#B4463F;
    --half:#C08A2E;
    --present:#3B7A55;
    --leave:#6B5CA5;
    --card:#FAF5EA;
    --shadow: 0 2px 10px rgba(30,45,55,0.14);
  }

  *{box-sizing:border-box;}
  #ghar-app{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    max-width:480px;
    margin:0 auto;
    background:var(--page);
    min-height:100vh;
    position:relative;
    padding-bottom:92px;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 33px,
      var(--page-line) 34px
    );
  }

  .cover{
    background:linear-gradient(180deg,var(--cover),var(--cover-dark));
    color:#F3E9DC;
    padding:20px 18px 22px;
    border-bottom:4px solid var(--gold);
    box-shadow: var(--shadow);
    position:relative;
  }
  .cover-title{
    font-family:'Roboto Slab',serif;
    font-size:22px;
    font-weight:700;
    letter-spacing:0.3px;
  }
  .cover-sub{
    font-size:12px;
    opacity:0.85;
    margin-top:4px;
    font-family:'Inter',sans-serif;
    letter-spacing:0.4px;
  }
  .cover-topright{
    position:absolute;
    top:20px;
    right:18px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .cover-date{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    background:rgba(0,0,0,0.18);
    padding:4px 8px;
    border-radius:3px;
    border:1px solid rgba(243,233,220,0.35);
  }

  .section{ padding:16px 16px 4px; }
  .section-head{
    display:flex; align-items:center; gap:8px;
    margin-bottom:10px;
  }
  .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .section-head h2{
    font-family:'Roboto Slab',serif;
    font-size:17px;
    margin:0;
  }
  .month-total{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
    margin-left:auto;
    background:var(--card);
    padding:3px 8px;
    border-radius:4px;
    border:1px solid var(--page-line);
  }

  .card{
    background:var(--card);
    border:1px solid var(--page-line);
    border-radius:8px;
    padding:14px;
    box-shadow: var(--shadow);
    margin-bottom:14px;
  }
  .field{ margin-bottom:10px; }
  .field label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .field input, .field select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--page-line);
    border-radius:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    background:#fff;
    color:var(--ink);
  }
  .row{ display:flex; gap:8px; }
  .row .field{ flex:1; }

  .btn{
    display:inline-block;
    border:none;
    border-radius:6px;
    padding:10px 14px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    color:#fff;
  }
  .btn-primary{ background:var(--ink); width:100%; }
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--page-line);
    font-weight:500;
  }
  .btn-small{ padding:5px 9px; font-size:12px; }
  .btn-danger{ background:var(--absent); }

  .status-toggle{ display:flex; gap:6px; }
  .status-toggle button{
    flex:1;
    padding:8px 0;
    border-radius:6px;
    border:1px solid var(--page-line);
    background:#fff;
    font-weight:600;
    font-size:12px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .status-toggle button.active-P{ background:var(--present); color:#fff; border-color:var(--present); }
  .status-toggle button.active-A{ background:var(--absent); color:#fff; border-color:var(--absent); }
  .status-toggle button.active-H{ background:var(--half); color:#fff; border-color:var(--half); }
  .status-toggle button.active-PL{ background:var(--leave); color:#fff; border-color:var(--leave); }
  .status-toggle button.active-WO{ background:var(--ink-soft); color:#fff; border-color:var(--ink-soft); }

  .staff-row{
    display:flex; align-items:center; gap:10px;
    padding:8px 0;
    border-bottom:1px dashed var(--page-line);
  }
  .staff-row:last-child{ border-bottom:none; }
  .staff-name{ flex:0 0 74px; font-size:13px; font-weight:600; }

  .log-list{ display:flex; flex-direction:column; gap:6px; }
  .log-row{
    display:flex; align-items:center; gap:10px;
    background:var(--card);
    border:1px solid var(--page-line);
    border-radius:6px;
    padding:9px 10px;
  }
  .log-date{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; color:var(--ink-soft);
    width:52px; flex-shrink:0;
  }
  .log-main{ flex:1; font-size:13px; }
  .log-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:2px 6px;
    border-radius:4px;
    color:#fff;
  }
  .log-actions{ display:flex; gap:6px; }
  .icon-btn{
    background:none; border:none; cursor:pointer;
    font-size:14px; color:var(--ink-soft); padding:2px 4px;
  }
  .empty-msg{
    text-align:center; color:var(--ink-soft); font-size:13px;
    padding:18px 0; font-style:italic;
  }

  .attendance-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .a-chip{
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    padding:3px 7px;
    border-radius:10px;
    color:#fff;
  }

  .summary-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat-card{
    background:var(--card);
    border:1px solid var(--page-line);
    border-radius:8px;
    padding:12px;
    box-shadow:var(--shadow);
  }
  .stat-label{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; }
  .stat-value{ font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; margin-top:4px; }

  .staff-manage{ margin-top:8px; }
  .staff-chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .staff-chip{
    background:#fff; border:1px solid var(--page-line); border-radius:14px;
    padding:4px 10px; font-size:12px; display:flex; align-items:center; gap:6px;
  }
  .staff-chip button{ background:none; border:none; color:var(--absent); cursor:pointer; font-size:12px; }

  .cat-edit-box{
    border:1px solid var(--page-line);
    border-radius:8px;
    padding:12px;
  }
  .swatch-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .swatch{
    width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;
  }
  .swatch.selected{ border-color:var(--ink); }
  .type-note{ font-size:12px; color:var(--ink-soft); margin-bottom:8px; }
  .icon-quick-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }

  .home-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:16px 8px;
  }
  .home-tile{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
    color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  .home-tile-icon{
    width:48px;
    height:48px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
  }
  .home-tile-label{
    font-size:11px;
    font-weight:600;
    text-align:center;
    line-height:1.25;
  }

  .home-bar{
    position:fixed;
    bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    display:flex;
    justify-content:space-evenly;
    align-items:stretch;
    background:var(--cover-dark);
    border-top:3px solid var(--gold);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    z-index:40;
  }
  .home-bar-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    color:#E8DCC9;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    background:none;
    border:none;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    flex:1 1 0;
    max-width:180px;
    min-height:52px;
    padding:6px 4px;
    -webkit-tap-highlight-color: rgba(243,233,220,0.25);
  }
  .home-bar-btn.active{
    color:#FAF5EA;
    background:rgba(243,233,220,0.14);
  }
  .home-bar-btn .tab-icon{ font-size:24px; display:block; line-height:1; }

  .save-toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:7px 14px; border-radius:16px;
    font-size:12px; opacity:0; pointer-events:none; transition:opacity 0.25s;
    max-width:440px; z-index:50;
  }
  .save-toast.show{ opacity:1; }
</style>

<script>
  // ---- Storage shim: gives the app the exact same window.storage.get/set/delete
  // interface the Claude artifact host provides, backed by browser localStorage
  // instead. This is the ONLY difference between this file and ghar-register.html
  // — every other line below is identical app code. Keys are namespaced with
  // "ghar_" so this app doesn't collide with anything else on the same origin.
  (function(){
    const PREFIX = 'ghar_';
    window.storage = {
      get: function(key, shared){
        try{
          const v = localStorage.getItem(PREFIX + key);
          if(v === null || v === undefined) return null;
          return { key: key, value: v, shared: !!shared };
        }catch(e){ return null; }
      },
      set: function(key, value, shared){
        try{
          localStorage.setItem(PREFIX + key, value);
          return { key: key, value: value, shared: !!shared };
        }catch(e){ return null; }
      },
      delete: function(key, shared){
        try{
          localStorage.removeItem(PREFIX + key);
          return { key: key, deleted: true, shared: !!shared };
        }catch(e){ return null; }
      },
      list: function(prefix, shared){
        try{
          const out = [];
          const p = PREFIX + (prefix || '');
          for(let i=0;i<localStorage.length;i++){
            const k = localStorage.key(i);
            if(k && k.indexOf(p) === 0) out.push(k.slice(PREFIX.length));
          }
          return { keys: out, prefix: prefix, shared: !!shared };
        }catch(e){ return null; }
      }
    };
  })();
</script>

<script>
(function(){
  const STATUS_LABEL = {P:'Present', A:'Absent', H:'Half day', PL:'Paid Leave', WO:'Weekly Off'};
  const STATUS_COLOR = {P:'var(--present)', A:'var(--absent)', H:'var(--half)', PL:'var(--leave)', WO:'var(--ink-soft)'};
  const WEEKDAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  const DEFAULT_CATEGORIES = [
    { id:'milk', name:'Milk', icon:'🥛', color:'#3E6FA8', type:'quantity', unit:'litre', entriesKey:'milk-entries', builtin:true },
    { id:'iron', name:'Iron (Istri)', icon:'👕', color:'#6E6A5E', type:'multiitem', hasDeliveryStatus:true,
      items:[{id:'clothes',name:'Clothes'},{id:'bedsheets',name:'Bedsheets'},{id:'saree',name:'Saree'},{id:'extra',name:'Extra'}],
      entriesKey:'iron-entries', builtin:true },
    { id:'vegetable', name:'Vegetable', icon:'🥦', color:'#3B7A55', type:'expense', hasReferenceFields:false,
      hasPaymentTracking:true, hasBillImage:true, entriesKey:'entries-vegetable', builtin:true },
    { id:'staff', name:'Staff', icon:'🧹', color:'#B07A1E', type:'attendance', builtin:true }
  ];

  const PALETTE = ['#8B4A9C','#C1440E','#2F6F6F','#A13D63','#4A6FA5','#7C9A45','#B5533C','#5C4B8A'];
  const QUICK_ICONS = ['🧺','🏠','💡','🔧','📦','🚗','📚','💊','🎉','🧹','🍳','🌿'];
  const STAFF_ICONS = ['🧹','🚗','🍳','🌿','🧺','🛠️','👶','🐕','🧑‍🔧','🧑‍🍳'];
  const DEFAULT_STAFF = [
    { id:'maid', name:'Maid', icon:'🧹', color:'#B07A1E' },
    { id:'driver', name:'Driver', icon:'🚗', color:'#4A6FA5' },
    { id:'cook', name:'Cook', icon:'🍳', color:'#3B7A55' }
  ];

  let state = {
    categories: [],
    entries: {},      // catId -> {date: value}  (quantity: number, multiitem: {itemId:qty,...,delivered}, expense: {amount,note})
    attendance: {},    // date -> {staffName: status}   (staff category only)
    staff: ['Maid','Driver','Cook'],
    rates: { quantityRates:{}, multiItemRates:{}, staffSalary:{} },
    advances: [],      // {id, category:catId, date, staff?, amount, note}
    bonuses: [],       // {id, category:catId, date, staff?, amount, note} — same shape as advances
    leavePolicy: {},   // staffName -> {type, weeklyDay, monthlyQuota, woComp, woRate, tracksHours, shiftHours, otRate}
    dutyHours: {},     // date -> {staffName: {in:"HH:MM", out:"HH:MM"}}
    autoEntries: {},   // catId -> {date: true}  — marks quantity entries that were auto-backfilled from defaultQty
    autoAttendance: {}, // staffName -> {date: true} — marks attendance days auto-filled as Present/WO
    returns: {},       // catId -> [{id, date, itemCounts:{itemId:count}, note}] — handover/return ledger for multiitem categories
    advanceSettlements: [], // {id, category:catId|'staff', staff?, type:'return'|'adjustment', date, amount, note} — settles down advances given
    payments: {},      // catId -> [{id, date, amount, note}] — rolling settle-up payments for Daily services with paymentFrequency:'adhoc'
    loaded: false
  };

  let activeTab = 'home';
  let catForms = {};           // catId -> form state, created lazily
  let advanceForms = {};       // catId -> form state, created lazily
  let bonusForms = {};         // catId -> form state, created lazily (same shape as advanceForms)
  let settlementForms = {};    // ownerKey -> {type, date, amount, note, editId} — Returns & Adjustments form
  let utilityForms = {};       // "catId::subtypeId" -> {date, amount, note}
  let paymentForms = {};       // catId -> {amount, date, note} — rolling settle-up payment form
  let returnForms = {};        // catId -> {date, items, note, editId} — handover/return ledger form
  let staffForm = { date: todayStr(), statuses: {} };
  let newStaffName = '';
  let summaryMonth = todayStr().slice(0,7);
  let yearlySelected = todayStr().slice(0,4);
  let accountsFilter = 'all'; // 'all' | 'cat:<id>' | 'utilsub:<id>' | 'staff:<name>' | 'group:daily' | 'group:adhoc' | 'group:utility' | 'group:staff'
  let settingsState = {
    newCat: { serviceKind:'daily', type:'quantity', name:'', icon:'', color: PALETTE[0], unit:'', items:[], newItemName:'', refFields:false, paymentFrequency:'monthly', paymentFrequencyDays:15, deliveryStatus:false },
    confirmDeleteId: null,
    itemInputs: {},
    selected: null // null = Settings hub, else {type:'category'|'utilitySubtype'|'staff'|'addCategory'|'addUtility'|'addStaff', id?}
  };

  function todayStr(){
    const d = new Date();
    return d.toISOString().slice(0,10);
  }
  function monthOf(dateStr){ return dateStr.slice(0,7); }
  function fmtDate(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short'});
  }
  function fmtMonthLabel(monthStr){
    const d = new Date(monthStr + '-01T00:00:00');
    return d.toLocaleDateString('en-GB', {month:'long', year:'numeric'});
  }
  function slugify(name){
    return (name || '').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'item';
  }
  function genId(prefix){
    return (prefix||'id') + '_' + Date.now().toString(36) + '_' + Math.floor(Math.random()*100000).toString(36);
  }
  function chunk(arr, size){
    const out = [];
    for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
    return out;
  }
  function getCat(id){ return state.categories.find(c => c.id === id); }

  async function loadAll(){
    const keys = ['categories','attendance','staff-list','rates','advances','leave-policy','duty-hours','auto-entries','auto-attendance','payments','bonuses','returns','advance-settlements'];
    const results = await Promise.all(keys.map(async k => {
      try{
        const r = await window.storage.get(k, false);
        return r ? JSON.parse(r.value) : null;
      }catch(e){ return null; }
    }));
    const [catsRaw, attendanceRaw, staffRaw, ratesRaw, advancesRaw, leavePolicyRaw, dutyHoursRaw, autoEntriesRaw, autoAttendanceRaw, paymentsRaw, bonusesRaw, returnsRaw, advanceSettlementsRaw] = results;

    if(!catsRaw || !Array.isArray(catsRaw) || catsRaw.length === 0){
      state.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
    } else {
      state.categories = catsRaw;
    }

    // ---- One-time merge: combine the separate bill categories into ONE "Utility" tab,
    // where each bill type (Electricity, Gas, Property Tax, ...) is a sub-type with its
    // own one-time Provider/CA Number/Meter Number, kept separate from any older per-category data.
    const legacyBillMeta = {
      utility_bills: { name:'Electricity', icon:'💡' },
      gas_bill: { name:'Gas', icon:'🔥' },
      property_tax: { name:'Property Tax', icon:'🏛' },
      other_utilities: { name:'Other', icon:'🧾' }
    };
    const legacyIds = Object.keys(legacyBillMeta);

    let utilCat = state.categories.find(c => c.id === 'utility');
    if(!utilCat){
      utilCat = { id:'utility', name:'Utility', icon:'🧾', color:'#7C9A45', type:'utilitygroup', builtin:false, subtypes:[], entriesKey:'entries-utility' };
      state.categories.push(utilCat);
    }
    if(!utilCat.subtypes) utilCat.subtypes = [];

    let utilEntries = {};
    try{
      const r = await window.storage.get(utilCat.entriesKey, false);
      utilEntries = r ? JSON.parse(r.value) : {};
    }catch(e){ utilEntries = {}; }

    const legacyCatsPresent = state.categories.filter(c => legacyIds.includes(c.id));
    if(legacyCatsPresent.length > 0){
      const legacyEntriesResults = await Promise.all(legacyCatsPresent.map(async c => {
        try{
          const r = await window.storage.get(c.entriesKey, false);
          return r ? JSON.parse(r.value) : {};
        }catch(e){ return {}; }
      }));
      legacyCatsPresent.forEach((legacyCat, i) => {
        const meta = legacyBillMeta[legacyCat.id] || { name: legacyCat.name, icon: legacyCat.icon };
        const subtypeId = slugify(meta.name);
        let st = utilCat.subtypes.find(s => s.id === subtypeId);
        if(!st){
          st = { id: subtypeId, name: meta.name, icon: meta.icon, provider:'', caNumber:'', meterNumber:'' };
          utilCat.subtypes.push(st);
        }
        const legacyEntries = legacyEntriesResults[i] || {};
        if(!utilEntries[subtypeId]) utilEntries[subtypeId] = {};
        Object.entries(legacyEntries).forEach(([date, rec]) => {
          if(rec && rec.provider && !st.provider) st.provider = rec.provider;
          if(rec && rec.caNumber && !st.caNumber) st.caNumber = rec.caNumber;
          if(rec && rec.meterNumber && !st.meterNumber) st.meterNumber = rec.meterNumber;
          utilEntries[subtypeId][date] = { amount: (rec && rec.amount) || 0, note: (rec && rec.note) || '' };
        });
        removeKey(legacyCat.entriesKey);
      });
      state.categories = state.categories.filter(c => !legacyIds.includes(c.id));
    }

    if(utilCat.subtypes.length === 0){
      utilCat.subtypes = [
        { id:'electricity', name:'Electricity', icon:'💡', provider:'', caNumber:'', meterNumber:'' },
        { id:'gas', name:'Gas', icon:'🔥', provider:'', caNumber:'', meterNumber:'' },
        { id:'property_tax', name:'Property Tax', icon:'🏛', provider:'', caNumber:'', meterNumber:'' }
      ];
    }
    save(utilCat.entriesKey, utilEntries);
    // -------------------------------------------------------------------------------------------

    // ---- Migration: Nariyal Pani (quantity) retired in favor of Vegetable (expense, with
    // payment tracking + bill photo — photo capture is mobile-only, see hasBillImage).
    // Old nariyal-entries data is left in storage untouched (not deleted) in case it's ever
    // needed, but the category itself is removed from the active list.
    const nariyalIdx = state.categories.findIndex(c => c.id === 'nariyal');
    if(nariyalIdx !== -1){
      state.categories.splice(nariyalIdx, 1);
    }
    if(!state.categories.some(c => c.id === 'vegetable')){
      state.categories.push({
        id:'vegetable', name:'Vegetable', icon:'🥦', color:'#3B7A55', type:'expense',
        hasReferenceFields:false, hasPaymentTracking:true, hasBillImage:true,
        entriesKey:'entries-vegetable', builtin:true
      });
    }
    // -------------------------------------------------------------------------------------------

    state.attendance = attendanceRaw || {};
    // ---- Migration: staff list used to be a plain array of name strings.
    // Now each staff member is an object with an id/icon/color (needed for per-staff tabs
    // and the Staff grid on the Home screen). Existing name-keyed data (attendance,
    // leave-policy, duty-hours, rates.staffSalary, advances.staff) is left keyed by
    // NAME as before — only the roster entry itself gains structure.
    if(!staffRaw || (Array.isArray(staffRaw) && staffRaw.length === 0)){
      state.staff = JSON.parse(JSON.stringify(DEFAULT_STAFF));
    } else if(Array.isArray(staffRaw) && typeof staffRaw[0] === 'string'){
      state.staff = staffRaw.map((name, i) => ({
        id: slugify(name) + '_' + i,
        name,
        icon: STAFF_ICONS[i % STAFF_ICONS.length],
        color: PALETTE[i % PALETTE.length]
      }));
      save('staff-list', state.staff);
    } else {
      state.staff = staffRaw;
    }
    // ---- Migration: any staff record missing attendanceAutoFrom (added before the
    // default-Present auto-fill feature existed) gets it set to today — auto-fill only
    // applies going forward, never retroactively over old unmarked history.
    let staffMigrated = false;
    state.staff.forEach(s => {
      if(!s.attendanceAutoFrom){ s.attendanceAutoFrom = todayStr(); staffMigrated = true; }
    });
    if(staffMigrated) save('staff-list', state.staff);
    state.leavePolicy = leavePolicyRaw || {};
    // ---- Migration: weeklyDay (single number) -> weeklyDays (array), so weekly-off can span
    // more than one day (e.g. both Saturday and Sunday).
    let leavePolicyMigrated = false;
    Object.keys(state.leavePolicy).forEach(name => {
      const p = state.leavePolicy[name];
      if(p && typeof p.weeklyDay === 'number' && !Array.isArray(p.weeklyDays)){
        p.weeklyDays = [p.weeklyDay];
        delete p.weeklyDay;
        leavePolicyMigrated = true;
      }
    });
    if(leavePolicyMigrated) save('leave-policy', state.leavePolicy);
    state.dutyHours = dutyHoursRaw || {};

    const rr = ratesRaw || {};
    if(rr.quantityRates || rr.multiItemRates){
      state.rates.quantityRates = rr.quantityRates || {};
      state.rates.multiItemRates = rr.multiItemRates || {};
      state.rates.staffSalary = rr.staffSalary || {};
    } else {
      state.rates.quantityRates = { milk: rr.milk || 0, nariyal: rr.nariyal || 0 };
      state.rates.multiItemRates = { iron: { clothes: rr.ironClothes||0, bedsheets: rr.ironBedsheets||0, saree: rr.ironSaree||0, extra: rr.ironExtra||0 } };
      state.rates.staffSalary = rr.staffSalary || {};
    }
    delete state.rates.quantityRates['nariyal']; // retired category — see Vegetable migration above

    state.advances = (advancesRaw || []).map(a => a.category ? a : Object.assign({}, a, {category: 'staff'}));

    // ---- Migration: advances used to be deducted from Accounts in the month they were GIVEN.
    // They're now deducted in the month they're explicitly settled (via an "adjustment" record),
    // since an advance given in July might really get adjusted against August's salary — that's
    // the whole point of tracking Returns & Adjustments separately. To avoid every past month's
    // total silently changing the moment this ships, every advance that already existed gets one
    // auto-generated adjustment record — same date, full amount — so historical totals are
    // unaffected. Only advances given AFTER this point need an explicit adjustment recorded.
    state.advanceSettlements = advanceSettlementsRaw || [];
    if(!advanceSettlementsRaw){
      state.advances.forEach(a => {
        state.advanceSettlements.push({
          id: genId('adj'), category: a.category, staff: a.staff || null, type: 'adjustment',
          date: a.date, amount: a.amount, note: 'Auto-recorded — pre-existing advance, kept in its original month'
        });
      });
      save('advance-settlements', state.advanceSettlements);
    }
    state.bonuses = bonusesRaw || [];

    const entryCats = state.categories.filter(c => c.type !== 'attendance' && c.type !== 'utilitygroup');
    const entryResults = await Promise.all(entryCats.map(async cat => {
      try{
        const r = await window.storage.get(cat.entriesKey, false);
        return r ? JSON.parse(r.value) : {};
      }catch(e){ return {}; }
    }));
    state.entries = {};
    entryCats.forEach((cat,i) => { state.entries[cat.id] = entryResults[i] || {}; });
    state.entries['utility'] = utilEntries;

    // ---- Migration: expense-category entries and utility bill entries used to be ONE
    // record per date. They now hold an ARRAY of records per date, so more than one entry
    // (e.g. two vegetable purchases the same day) can be logged and each tracked/edited/paid
    // independently. Old single-record values are wrapped into a one-item array with a
    // generated id; already-migrated (array) values are left untouched.
    function migrateDateRecordsToArrays(entriesForCat){
      let changed = false;
      Object.keys(entriesForCat).forEach(date => {
        const v = entriesForCat[date];
        if(v && !Array.isArray(v)){
          entriesForCat[date] = [Object.assign({ id: genId('e') }, v)];
          changed = true;
        }
      });
      return changed;
    }
    entryCats.filter(c => c.type === 'expense').forEach(cat => {
      if(migrateDateRecordsToArrays(state.entries[cat.id])) save(cat.entriesKey, state.entries[cat.id]);
    });
    if(utilCat && utilCat.subtypes){
      let utilChanged = false;
      utilCat.subtypes.forEach(st => {
        if(!state.entries['utility'][st.id]) state.entries['utility'][st.id] = {};
        if(migrateDateRecordsToArrays(state.entries['utility'][st.id])) utilChanged = true;
      });
      if(utilChanged) save(utilCat.entriesKey, state.entries['utility']);
    }
    // -------------------------------------------------------------------------------------------

    // ---- Migration: multi-item categories (e.g. Iron) used to track handover/return with a
    // single "delivered" boolean per day's entry — no way to record a PARTIAL return, and no
    // running balance of how many items are still with the vendor. That's now a proper ledger
    // (state.returns): old entries marked delivered:true become one return record dated the
    // same day, covering everything handed over that day (the closest honest equivalent of
    // what "delivered" used to mean); delivered:false/absent entries are left as outstanding.
    state.returns = returnsRaw || {};
    state.categories.filter(c => c.type === 'multiitem' && c.hasDeliveryStatus).forEach(cat => {
      if(state.returns[cat.id]) return; // already migrated (or user already has real return records)
      state.returns[cat.id] = [];
      Object.entries(state.entries[cat.id] || {}).forEach(([date, rec]) => {
        if(rec && rec.delivered){
          const itemCounts = {};
          (cat.items||[]).forEach(it => { itemCounts[it.id] = rec[it.id] || 0; });
          state.returns[cat.id].push({ id: genId('ret'), date, itemCounts, note: 'Migrated from earlier delivered-status record' });
        }
      });
      save('returns', state.returns);
    });
    // -------------------------------------------------------------------------------------------

    // ---- Migration: quantity and multi-item entries used to hold ONE record per date too —
    // same overwrite bug as expense/utility had (a second same-day save silently replaced the
    // first instead of adding to it). They now hold an ARRAY of records per date, matching
    // expense/utility. Old scalar quantity values become {id, value}; old multi-item record
    // objects are wrapped the same way expense/utility already are. Placed AFTER the
    // delivered/returns migration above, which still expects plain multi-item objects.
    entryCats.filter(c => c.type === 'quantity').forEach(cat => {
      let changed = false;
      const entriesForCat = state.entries[cat.id] || {};
      Object.keys(entriesForCat).forEach(date => {
        const v = entriesForCat[date];
        if(v !== undefined && v !== null && !Array.isArray(v)){
          entriesForCat[date] = [{ id: genId('e'), value: v }];
          changed = true;
        }
      });
      if(changed) save(cat.entriesKey, entriesForCat);
    });
    entryCats.filter(c => c.type === 'multiitem').forEach(cat => {
      if(migrateDateRecordsToArrays(state.entries[cat.id])) save(cat.entriesKey, state.entries[cat.id]);
    });
    // -------------------------------------------------------------------------------------------

    // ---- Migration: every service category now has an explicit serviceKind ('daily' or
    // 'adhoc') and, for daily services, a paymentFrequency ('monthly' or 'adhoc'). Existing
    // categories (created before this distinction existed) default to daily+monthly — i.e.
    // exactly how they already behaved. Vegetable specifically already had per-entry
    // dueDate/paidDate tracking from an earlier version, which best maps onto the new
    // rolling settle-up model (Daily + Ad-hoc payment frequency) — its already-paid entries
    // are converted into payment-ledger records so the running balance starts accurate
    // rather than appearing to owe the full historical total again.
    state.payments = paymentsRaw || {};
    let catsMigrated = false;
    state.categories.filter(c => c.type !== 'attendance' && c.type !== 'utilitygroup').forEach(cat => {
      if(!cat.serviceKind){
        if(cat.id === 'vegetable' && cat.hasPaymentTracking){
          cat.serviceKind = 'daily';
          cat.paymentFrequency = 'adhoc';
          cat.paymentFrequencyDays = 15;
          cat.paymentFrequencyStart = todayStr();
          if(!state.payments[cat.id]){
            state.payments[cat.id] = [];
            Object.entries(state.entries[cat.id] || {}).forEach(([date, dayList]) => {
              (Array.isArray(dayList) ? dayList : []).forEach(rec => {
                if(rec && rec.paidDate){
                  state.payments[cat.id].push({ id: genId('pay'), date: rec.paidDate, amount: rec.amount || 0, note: 'Migrated from earlier per-entry paid record' });
                }
              });
            });
          }
        } else {
          cat.serviceKind = 'daily';
          cat.paymentFrequency = 'monthly';
        }
        catsMigrated = true;
      }
    });
    if(catsMigrated){ save('categories', state.categories); save('payments', state.payments); }
    // -------------------------------------------------------------------------------------------

    state.autoEntries = autoEntriesRaw || {};
    // ---- Auto-backfill default daily quantities (e.g. Milk). Any quantity category with
    // a defaultQty set gets that value silently written in for every day strictly BEFORE
    // today that has no entry yet, starting from the date the default was first turned on
    // (autoBackfillFrom) — not retroactively before that. Today itself is never auto-filled,
    // since the day hasn't "passed" yet and the user may still log something different.
    // Auto-filled dates are marked in state.autoEntries so the UI can show an "Auto" badge;
    // editing or deleting that day's entry clears the marker (see gharCatEntrySave/Delete).
    const today = todayStr();
    state.categories.filter(c => c.type === 'quantity' && c.defaultQty > 0 && c.autoBackfillFrom).forEach(cat => {
      if(!state.entries[cat.id]) state.entries[cat.id] = {};
      if(!state.autoEntries[cat.id]) state.autoEntries[cat.id] = {};
      let d = new Date(cat.autoBackfillFrom + 'T00:00:00');
      const end = new Date(today + 'T00:00:00');
      let changed = false;
      while(d < end){
        const dStr = d.toISOString().slice(0,10);
        const existing = state.entries[cat.id][dStr];
        if(!existing || (Array.isArray(existing) && existing.length === 0)){
          const entryId = genId('e');
          state.entries[cat.id][dStr] = [{ id: entryId, value: cat.defaultQty }];
          state.autoEntries[cat.id][dStr] = entryId;
          changed = true;
        }
        d.setDate(d.getDate() + 1);
      }
      if(changed) save(cat.entriesKey, state.entries[cat.id]);
    });
    save('auto-entries', state.autoEntries);
    // -------------------------------------------------------------------------------------------

    // ---- Auto-fill attendance as Present (or Weekly Off) for any day strictly before today
    // that was never marked. Mirrors the quantity default-qty backfill above: only from the
    // date the staff member was added (attendanceAutoFrom), not retroactively, and today is
    // never force-filled — the UI just shows Present pre-selected there until Save is pressed.
    state.autoAttendance = autoAttendanceRaw || {};
    state.staff.forEach(s => {
      if(!s.attendanceAutoFrom) return;
      const name = s.name;
      if(!state.autoAttendance[name]) state.autoAttendance[name] = {};
      let d = new Date(s.attendanceAutoFrom + 'T00:00:00');
      const end = new Date(today + 'T00:00:00');
      let changed = false;
      while(d < end){
        const dStr = d.toISOString().slice(0,10);
        if(!state.attendance[dStr]) state.attendance[dStr] = {};
        if(state.attendance[dStr][name] === undefined){
          state.attendance[dStr][name] = isWeeklyOffDate(name, dStr) ? 'WO' : 'P';
          state.autoAttendance[name][dStr] = true;
          changed = true;
        }
        d.setDate(d.getDate() + 1);
      }
      if(changed) save('attendance', state.attendance);
    });
    save('auto-attendance', state.autoAttendance);
    // -------------------------------------------------------------------------------------------

    state.loaded = true;
    save('categories', state.categories);
    save('rates', state.rates);
    render();
  }

  async function save(key, value){
    try{
      await window.storage.set(key, JSON.stringify(value), false);
    }catch(e){ console.error('storage save failed', key, e); }
  }
  async function removeKey(key){
    try{
      if(window.storage.delete) await window.storage.delete(key, false);
    }catch(e){ console.error('storage delete failed', key, e); }
  }

  function toast(msg){
    const t = document.getElementById('ghar-toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window.__gharToastTimer);
    window.__gharToastTimer = setTimeout(()=> t.classList.remove('show'), 1400);
  }

  function ensureCatForm(catId){
    if(catForms[catId]) return catForms[catId];
    const cat = getCat(catId);
    let f;
    if(!cat){ f = { date: todayStr() }; }
    else if(cat.type === 'quantity'){ f = { date: todayStr(), value: '', editId: null }; }
    else if(cat.type === 'multiitem'){
      f = { date: todayStr(), items: {}, editId: null };
      (cat.items||[]).forEach(it => f.items[it.id] = '');
    } else if(cat.type === 'expense'){
      f = { date: todayStr(), amount: '', note: '', editId: null, logMonth: todayStr().slice(0,7) };
      if(cat.hasReferenceFields){ f.provider = ''; f.caNumber = ''; f.meterNumber = ''; }
      if(cat.hasPaymentTracking){ f.dueDate = ''; f.paidDate = ''; }
    }
    else { f = { date: todayStr() }; }
    catForms[catId] = f;
    return f;
  }
  function ensureAdvanceForm(catId){
    if(!advanceForms[catId]) advanceForms[catId] = { date: todayStr(), amount:'', note:'', staff:'', editId: null };
    return advanceForms[catId];
  }
  function ensureBonusForm(catId){
    if(!bonusForms[catId]) bonusForms[catId] = { date: todayStr(), amount:'', note:'', staff:'', editId: null };
    return bonusForms[catId];
  }
  function ensureSettlementForm(catId){
    if(!settlementForms[catId]) settlementForms[catId] = { type: 'return', date: todayStr(), amount:'', note:'', editId: null };
    return settlementForms[catId];
  }

  // ---------- Generic entry actions ----------
  window.gharSetTab = function(tab){
    activeTab = tab;
    if(tab.indexOf('staffp_') === 0){
      loadStaffFormFor(staffForm.date);
    }
    render();
  };

  window.gharCatFormUpdate = function(catId, field, val){
    const f = ensureCatForm(catId);
    f[field] = val;
  };
  window.gharCatFormTogglePaid = function(catId, checked){
    const f = ensureCatForm(catId);
    f.paidDate = checked ? todayStr() : '';
    render();
  };
  window.gharCatItemFormUpdate = function(catId, itemId, val){
    const f = ensureCatForm(catId);
    f.items = f.items || {};
    f.items[itemId] = val;
  };

  window.gharCatEntrySave = function(catId){
    const cat = getCat(catId);
    if(!cat) return;
    const f = ensureCatForm(catId);
    if(!f.date){ toast('Pick a date'); return; }
    if(cat.type === 'quantity'){
      const val = parseFloat(f.value);
      if(isNaN(val) || val < 0){ toast('Enter a valid quantity'); return; }
      if(!state.entries[catId][f.date]) state.entries[catId][f.date] = [];
      const dayList = state.entries[catId][f.date];
      if(f.editId){
        const idx = dayList.findIndex(e => e.id === f.editId);
        if(idx !== -1) dayList[idx] = { id: f.editId, value: val };
        else dayList.push({ id: genId('e'), value: val });
      } else {
        dayList.push({ id: genId('e'), value: val });
      }
      save(cat.entriesKey, state.entries[catId]);
      if(state.autoEntries[catId] && state.autoEntries[catId][f.date]){
        delete state.autoEntries[catId][f.date];
        save('auto-entries', state.autoEntries);
      }
      f.value = ''; f.editId = null;
    } else if(cat.type === 'multiitem'){
      const rec = {};
      let sum = 0;
      (cat.items||[]).forEach(it => {
        const n = parseInt((f.items||{})[it.id], 10) || 0;
        rec[it.id] = n;
        sum += n;
      });
      if(sum <= 0){ toast('Enter at least one item'); return; }
      if(!state.entries[catId][f.date]) state.entries[catId][f.date] = [];
      const dayList = state.entries[catId][f.date];
      if(f.editId){
        const idx = dayList.findIndex(e => e.id === f.editId);
        if(idx !== -1) dayList[idx] = Object.assign({ id: f.editId }, rec);
        else dayList.push(Object.assign({ id: genId('e') }, rec));
      } else {
        dayList.push(Object.assign({ id: genId('e') }, rec));
      }
      save(cat.entriesKey, state.entries[catId]);
      (cat.items||[]).forEach(it => { f.items[it.id] = ''; });
      f.editId = null;
    } else if(cat.type === 'expense'){
      const amt = parseFloat(f.amount);
      if(isNaN(amt) || amt <= 0){ toast('Enter a valid amount'); return; }
      const rec = { amount: amt, note: (f.note || '').trim() };
      if(cat.hasReferenceFields){
        rec.provider = (f.provider || '').trim();
        rec.caNumber = (f.caNumber || '').trim();
        rec.meterNumber = (f.meterNumber || '').trim();
      }
      if(cat.hasPaymentTracking){
        rec.dueDate = f.dueDate || '';
        rec.paidDate = f.paidDate || '';
      }
      if(!state.entries[catId][f.date]) state.entries[catId][f.date] = [];
      const dayList = state.entries[catId][f.date];
      if(f.editId){
        const idx = dayList.findIndex(e => e.id === f.editId);
        if(idx !== -1) dayList[idx] = Object.assign({ id: f.editId }, rec);
        else dayList.push(Object.assign({ id: genId('e') }, rec)); // edited entry vanished (e.g. deleted elsewhere) — add as new instead of losing the data
      } else {
        dayList.push(Object.assign({ id: genId('e') }, rec));
      }
      save(cat.entriesKey, state.entries[catId]);
      f.amount = ''; f.note = ''; f.editId = null;
      if(cat.hasPaymentTracking){ f.dueDate = ''; f.paidDate = ''; }
      // provider/CA/meter usually don't change bill-to-bill, so keep them filled in for next time
    }
    toast(cat.name + ' entry saved');
    render();
  };

  window.gharCatEntryEdit = function(catId, date, entryId){
    const cat = getCat(catId);
    if(!cat) return;
    const f = ensureCatForm(catId);
    f.date = date;
    if(cat.type === 'quantity'){
      const dayList = state.entries[catId][date] || [];
      const rec = dayList.find(e => e.id === entryId);
      if(!rec) return;
      f.editId = entryId;
      f.value = String(rec.value);
    } else if(cat.type === 'multiitem'){
      const dayList = state.entries[catId][date] || [];
      const rec = dayList.find(e => e.id === entryId);
      if(!rec) return;
      f.editId = entryId;
      f.items = {};
      (cat.items||[]).forEach(it => { f.items[it.id] = String(rec[it.id] || 0); });
    } else if(cat.type === 'expense'){
      const dayList = state.entries[catId][date] || [];
      const rec = dayList.find(e => e.id === entryId);
      if(!rec) return;
      f.editId = entryId;
      f.amount = String(rec.amount || 0);
      f.note = rec.note || '';
      if(cat.hasReferenceFields){
        f.provider = rec.provider || '';
        f.caNumber = rec.caNumber || '';
        f.meterNumber = rec.meterNumber || '';
      }
      if(cat.hasPaymentTracking){
        f.dueDate = rec.dueDate || '';
        f.paidDate = rec.paidDate || '';
      }
    }
    render();
  };

  window.gharCatEntryCancelEdit = function(catId){
    const cat = getCat(catId);
    if(!cat) return;
    const f = ensureCatForm(catId);
    f.editId = null;
    if(cat.type === 'quantity'){ f.value = ''; }
    else if(cat.type === 'multiitem'){ (cat.items||[]).forEach(it => { f.items[it.id] = ''; }); }
    else if(cat.type === 'expense'){
      f.amount = ''; f.note = '';
      if(cat.hasPaymentTracking){ f.dueDate = ''; f.paidDate = ''; }
    }
    render();
  };

  window.gharCatEntryDelete = function(catId, date, entryId){
    const cat = getCat(catId);
    if(!cat) return;
    const dayList = state.entries[catId][date] || [];
    state.entries[catId][date] = dayList.filter(e => e.id !== entryId);
    if(state.entries[catId][date].length === 0) delete state.entries[catId][date];
    save(cat.entriesKey, state.entries[catId]);
    if(state.autoEntries[catId] && state.autoEntries[catId][date]){
      delete state.autoEntries[catId][date];
      save('auto-entries', state.autoEntries);
    }
    toast('Entry removed');
    render();
  };

  window.gharCatMarkPaid = function(catId, date, entryId){
    const cat = getCat(catId);
    if(!cat) return;
    const dayList = state.entries[catId][date] || [];
    const rec = dayList.find(e => e.id === entryId);
    if(!rec) return;
    rec.paidDate = todayStr();
    save(cat.entriesKey, state.entries[catId]);
    toast('Marked paid today — adjust the date below if needed');
    window.gharCatEntryEdit(catId, date, entryId); // reopen in the form so the date is visible & editable, not just silently set
  };
  window.gharCatMarkUnpaid = function(catId, date, entryId){
    const cat = getCat(catId);
    if(!cat) return;
    const dayList = state.entries[catId][date] || [];
    const rec = dayList.find(e => e.id === entryId);
    if(!rec) return;
    rec.paidDate = '';
    save(cat.entriesKey, state.entries[catId]);
    toast('Marked unpaid');
    render();
  };
  window.gharCatLogMonthChange = function(catId, val){
    const f = ensureCatForm(catId);
    f.logMonth = val;
    render();
  };

  // ---------- Attendance / staff ----------
  function loadStaffFormFor(dateStr){
    staffForm.date = dateStr;
    staffForm.statuses = Object.assign({}, state.attendance[dateStr] || {});
    staffForm.hours = {};
    const dh = state.dutyHours[dateStr] || {};
    state.staff.forEach(s => {
      const n = s.name;
      staffForm.hours[n] = { in: (dh[n] && dh[n].in) || '', out: (dh[n] && dh[n].out) || '' };
    });
  }
  window.gharStaffDateChange = function(val){
    loadStaffFormFor(val);
    render();
  };
  window.gharStaffSetStatus = function(name, status){
    staffForm.statuses[name] = status;
    render();
  };
  window.gharStaffSave = function(){
    // Anyone not explicitly toggled defaults to Present (or WO on their weekly-off day) —
    // matches what's shown pre-selected in the UI, so Save always persists a definitive
    // status for every staff member rather than silently skipping untouched ones.
    const finalStatuses = {};
    state.staff.forEach(s => {
      const name = s.name;
      finalStatuses[name] = staffForm.statuses[name] || (isWeeklyOffDate(name, staffForm.date) ? 'WO' : 'P');
    });
    state.attendance[staffForm.date] = finalStatuses;
    if(state.autoAttendance){
      state.staff.forEach(s => {
        if(state.autoAttendance[s.name]) delete state.autoAttendance[s.name][staffForm.date];
      });
      save('auto-attendance', state.autoAttendance);
    }
    save('attendance', state.attendance);
    // save duty hours for staff who track them
    const dayLog = {};
    state.staff.forEach(s => {
      const n = s.name;
      const p = getLeavePolicy(n);
      const h = (staffForm.hours || {})[n];
      if(p.tracksHours && h && (h.in || h.out)){ dayLog[n] = { in: h.in || '', out: h.out || '' }; }
    });
    if(Object.keys(dayLog).length > 0){ state.dutyHours[staffForm.date] = dayLog; }
    else { delete state.dutyHours[staffForm.date]; }
    save('duty-hours', state.dutyHours);
    toast('Attendance saved');

  // ---------- Paid leave policy ----------
  const LEAVE_POLICY_DEFAULT = {
    type:'none', weeklyDays:[0], monthlyQuota:0,
    woComp:'money',      // 'money' | 'compoff' — how a worked weekly-off is compensated
    woRate:0,            // ₹ per weekly-off day worked (when woComp === 'money')
    tracksHours:false,   // record daily in/out times (e.g. driver)
    shiftHours:8,        // standard duty hours per day
    otRate:0,            // ₹ per overtime hour
    clockMode:false      // true = staff clocks in/out with a button (stamps actual time) instead of typing HH:MM
  };
  function getLeavePolicy(name){
    return Object.assign({}, LEAVE_POLICY_DEFAULT, state.leavePolicy[name] || {});
  }
  function ensureLeavePolicy(name){
    if(!state.leavePolicy[name]) state.leavePolicy[name] = Object.assign({}, LEAVE_POLICY_DEFAULT);
    else state.leavePolicy[name] = Object.assign({}, LEAVE_POLICY_DEFAULT, state.leavePolicy[name]);
    return state.leavePolicy[name];
  }
  function isWeeklyOffDate(name, dateStr){
    const p = getLeavePolicy(name);
    if(p.type !== 'weekly') return false;
    const d = new Date(dateStr + 'T00:00:00');
    return (p.weeklyDays || []).includes(d.getDay());
  }
  function effectiveStatus(name, dateStr){
    const rec = state.attendance[dateStr];
    const explicit = rec ? rec[name] : undefined;
    if(explicit) return explicit;
    if(isWeeklyOffDate(name, dateStr)) return 'WO';
    return undefined;
  }
  function leavePolicyLabel(name){
    const p = state.leavePolicy[name];
    if(!p) return '';
    const bits = [];
    if(p.type === 'weekly' && (p.weeklyDays||[]).length){
      bits.push(p.weeklyDays.slice().sort().map(i => WEEKDAY_NAMES[i].slice(0,3)).join('/') + ' off');
    }
    if(p.type === 'monthly') bits.push(p.monthlyQuota + ' PL/mo');
    if(p.tracksHours) bits.push(p.shiftHours + 'h shift');
    return bits.join(' · ');
  }
  function plChipLabel(name, plCount){
    const p = getLeavePolicy(name);
    if(p.type === 'monthly') return 'PL: ' + plCount + '/' + p.monthlyQuota;
    return 'PL: ' + plCount;
  }

  // ---------- Weekly-off worked & overtime ----------
  function datesInScope(scope, isYear){
    return Object.keys(state.attendance).filter(d => isYear ? d.slice(0,4) === scope : monthOf(d) === scope);
  }
  function weeklyOffsWorked(name, scope, isYear){
    return datesInScope(scope, isYear).filter(d =>
      isWeeklyOffDate(name, d) && state.attendance[d] && state.attendance[d][name] === 'P'
    ).length;
  }
  function parseHHMM(t){
    if(!t || typeof t !== 'string' || t.indexOf(':') === -1) return null;
    const [h,m] = t.split(':').map(n => parseInt(n,10));
    if(isNaN(h) || isNaN(m)) return null;
    return h * 60 + m;
  }
  function dayWorkedHours(name, dateStr){
    const rec = state.dutyHours[dateStr];
    const log = rec ? rec[name] : null;
    if(!log) return null;
    const a = parseHHMM(log.in), b = parseHHMM(log.out);
    if(a === null || b === null) return null;
    let mins = b - a;
    if(mins < 0) mins += 24 * 60; // overnight shift
    return mins / 60;
  }
  function overtimeSummary(name, scope, isYear){
    const p = getLeavePolicy(name);
    let worked = 0, otHours = 0, daysLogged = 0;
    Object.keys(state.dutyHours).forEach(d => {
      const inScope = isYear ? d.slice(0,4) === scope : monthOf(d) === scope;
      if(!inScope) return;
      const h = dayWorkedHours(name, d);
      if(h === null) return;
      daysLogged++;
      worked += h;
      if(h > p.shiftHours) otHours += (h - p.shiftHours);
    });
    return { daysLogged, worked, otHours, otAmount: otHours * (p.otRate || 0) };
  }
  function staffExtras(name, scope, isYear){
    const p = getLeavePolicy(name);
    const woWorked = weeklyOffsWorked(name, scope, isYear);
    const ot = p.tracksHours ? overtimeSummary(name, scope, isYear) : { daysLogged:0, worked:0, otHours:0, otAmount:0 };
    const woPay = (p.type === 'weekly' && p.woComp === 'money') ? woWorked * (p.woRate || 0) : 0;
    const compOff = (p.type === 'weekly' && p.woComp === 'compoff') ? woWorked : 0;
    return { policy:p, woWorked, woPay, compOff, ot };
  }

  // ---------- Calculation helpers ----------
  function sortedDatesDesc(obj){
    return Object.keys(obj).sort((a,b)=> a < b ? 1 : -1);
  }
  function monthEntries(catId, month){
    return Object.entries(state.entries[catId] || {}).filter(([d]) => monthOf(d) === month);
  }
  function catQuantityTotal(catId, month){
    return monthEntries(catId, month).reduce((s,[,v]) => {
      if(Array.isArray(v)) return s + v.reduce((a,e) => a + ((e && typeof e.value === 'number') ? e.value : 0), 0);
      return s + (typeof v === 'number' ? v : 0);
    }, 0);
  }
  function catQuantityAmount(catId, month){
    const rate = (state.rates.quantityRates || {})[catId] || 0;
    return catQuantityTotal(catId, month) * rate;
  }
  function catMultiItemBreakdown(catId, month){
    const cat = getCat(catId);
    const b = {};
    (cat.items||[]).forEach(it => b[it.id] = 0);
    monthEntries(catId, month).forEach(([,v]) => {
      const list = Array.isArray(v) ? v : (v ? [v] : []);
      list.forEach(rec => {
        (cat.items||[]).forEach(it => { b[it.id] += (rec && rec[it.id]) || 0; });
      });
    });
    return b;
  }
  function catMultiItemTotalCount(catId, month){
    const b = catMultiItemBreakdown(catId, month);
    return Object.values(b).reduce((s,n)=>s+n,0);
  }

  // ---------- Handover/return ledger (multi-item categories like Iron) ----------
  // Balance per item type = everything ever handed over minus everything ever returned.
  // Returns are recorded independently of any specific handover date, since a vendor may
  // return items from several earlier drop-offs together, or return one drop-off in parts.
  function catItemsHandedOverAllTime(catId){
    const cat = getCat(catId);
    const totals = {};
    (cat.items||[]).forEach(it => totals[it.id] = 0);
    Object.values(state.entries[catId] || {}).forEach(dayVal => {
      const list = Array.isArray(dayVal) ? dayVal : (dayVal ? [dayVal] : []);
      list.forEach(rec => {
        (cat.items||[]).forEach(it => { totals[it.id] += (rec && rec[it.id]) || 0; });
      });
    });
    return totals;
  }
  function catItemsReturnedAllTime(catId){
    const cat = getCat(catId);
    const totals = {};
    (cat.items||[]).forEach(it => totals[it.id] = 0);
    (state.returns[catId] || []).forEach(r => {
      (cat.items||[]).forEach(it => { totals[it.id] += (r.itemCounts && r.itemCounts[it.id]) || 0; });
    });
    return totals;
  }
  function catItemBalance(catId){
    const cat = getCat(catId);
    const handedOver = catItemsHandedOverAllTime(catId);
    const returned = catItemsReturnedAllTime(catId);
    const balance = {};
    (cat.items||[]).forEach(it => { balance[it.id] = handedOver[it.id] - returned[it.id]; });
    return balance;
  }
  function ensureReturnForm(catId){
    if(!returnForms[catId]){
      const cat = getCat(catId);
      const items = {};

    }
    return returnForms[catId];
  }

  window.gharReturnSave = function(catId){
    const cat = getCat(catId);
    if(!cat) return;
    const f = ensureReturnForm(catId);
    if(!f.date){ toast('Pick a date'); return; }
    const itemCounts = {};
    let sum = 0;
    (cat.items||[]).forEach(it => {
      const n = parseInt((f.items||{})[it.id], 10) || 0;
      itemCounts[it.id] = n;
      sum += n;
    });
    if(sum <= 0){ toast('Enter at least one returned item'); return; }

    // Can't record a return for more than is actually outstanding. When editing an existing
    // record, first add back its OLD contribution to the balance so we're validating against
    // "what would be outstanding without this record", not double-counting it against itself.
    let balance = catItemBalance(catId);
    if(f.editId){
      const oldRec = (state.returns[catId] || []).find(r => r.id === f.editId);
      if(oldRec){
        balance = Object.assign({}, balance);
        (cat.items||[]).forEach(it => {
          balance[it.id] = (balance[it.id] || 0) + ((oldRec.itemCounts && oldRec.itemCounts[it.id]) || 0);
        });
      }
    }
    const overLimit = (cat.items||[]).filter(it => itemCounts[it.id] > (balance[it.id] || 0));
    if(overLimit.length > 0){
      const msg = overLimit.map(it => `${it.name} (only ${balance[it.id]||0} outstanding)`).join(', ');
      toast("Can't exceed the balance — " + msg);
      return;
    }

    if(!state.returns[catId]) state.returns[catId] = [];
    if(f.editId){
      const rec = state.returns[catId].find(r => r.id === f.editId);
      if(rec){
        rec.date = f.date;
        rec.itemCounts = itemCounts;
        rec.note = (f.note || '').trim();
        toast('Return updated');
      }
      f.editId = null;
    } else {
      state.returns[catId].push({ id: genId('ret'), date: f.date, itemCounts, note: (f.note || '').trim() });
      toast('Return recorded');
    }
    save('returns', state.returns);
    (cat.items||[]).forEach(it => { f.items[it.id] = ''; });
    f.note = '';
    render();
  };

  // Quick actions from a specific handover row — both just open the return form (further down

  window.gharReturnFullFromEntry = function(catId, date, entryId){
    const cat = getCat(catId);
    if(!cat) return;
    const dayList = state.entries[catId][date] || [];
    const rec = entryId ? dayList.find(e => e.id === entryId) : dayList[0];

  function catMultiItemAmount(catId, month){

  function monthAdjustmentBreakdown(month){

      .filter(s => s.type === 'adjustment' && s.category === 'staff' && monthOf(s.date) === month)

  // ---------- Rolling settle-up (Daily service, Payment Frequency = "every N days") ----------
  // Used instead of monthly Accounts settlement or per-entry paid/unpaid: entries accumulate
  // into one running balance, due N days after the last payment (or since the frequency was
  // turned on, if nothing's been paid yet), and partial payments roll the remainder forward.
  function catGrossAllTime(catId){
    const cat = getCat(catId);
    if(!cat) return 0;
    const allEntries = Object.entries(state.entries[catId] || {});
    if(cat.type === 'quantity'){
      const total = allEntries.reduce((s,[,v]) => {
        if(Array.isArray(v)) return s + v.reduce((a,e) => a + ((e && typeof e.value === 'number') ? e.value : 0), 0);
        return s + (typeof v === 'number' ? v : 0);
      }, 0);
      const rate = (state.rates.quantityRates || {})[catId] || 0;
      return total * rate;
    }
    if(cat.type === 'multiitem'){
      const b = {};
      (cat.items||[]).forEach(it => b[it.id] = 0);
      allEntries.forEach(([,v]) => {
        const list = Array.isArray(v) ? v : (v ? [v] : []);
        list.forEach(rec => { (cat.items||[]).forEach(it => { b[it.id] += (rec && rec[it.id]) || 0; }); });
      });
      const rates = (state.rates.multiItemRates || {})[catId] || {};
      return (cat.items||[]).reduce((s,it) => s + (b[it.id]||0) * (rates[it.id]||0), 0);
    }
    if(cat.type === 'expense'){
      return allEntries.reduce((s,[,v]) => s + (Array.isArray(v) ? v.reduce((a,e)=>a+((e&&e.amount)||0),0) : ((v && v.amount) || 0)), 0);
    }
    return 0;
  }
  function catTotalPaid(catId){

  }
  function catOutstandingBalance(catId){

  function catLastPaymentDate(catId){
    const list = state.payments[catId] || [];
    return list.reduce((latest, p) => (!latest || p.date > latest) ? p.date : latest, null);

  function catNextDueDate(catId){
    const cat = getCat(catId);

    const d = new Date(base + 'T00:00:00');

  // ---------- Render ----------
  function render(){
    const app = document.getElementById('ghar-app');
    if(!app) return;
    const todayLabel = new Date().toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});

    let body = '';
    if(activeTab === 'home') body = renderHome();
    else if(activeTab === 'monthly') body = renderMonthly();
    else if(activeTab === 'yearly') body = renderYearly();
    else if(activeTab === 'settings') body = renderSettings();
    else if(activeTab.indexOf('staffp_') === 0){
      const staffId = activeTab.slice(7);
      const s = state.staff.find(x => x.id === staffId);
      if(!s){ activeTab = 'home'; body = renderHome(); }
      else body = renderStaffPerson(s);
    }
    else if(activeTab.indexOf('utilsub_') === 0){
      const subId = activeTab.slice(8);
      const utilCat = getCat('utility');
      const st = utilCat ? getUtilitySubtype(utilCat, subId) : null;
      if(!st){ activeTab = 'home'; body = renderHome(); }
      else body = renderUtilitySubtypePage(utilCat, st);
    }
    else {
      const cat = getCat(activeTab);
      if(!cat || cat.type === 'attendance' || cat.type === 'utilitygroup'){
        activeTab = 'home';
        body = renderHome();
      } else if(cat.type === 'quantity') body = renderQuantityTab(cat);
      else if(cat.type === 'multiitem') body = renderMultiItemTab(cat);
      else if(cat.type === 'expense') body = renderExpenseTab(cat);
    }

    app.innerHTML = `
      <div class="cover">
        <div class="cover-title">Ghar Khata</div>
        <div class="cover-sub">Household vendor &amp; staff ledger</div>
        <div class="cover-topright">
          <div class="cover-date">${todayLabel}</div>
        </div>
      </div>
      ${body}
      <div class="home-bar">
        <button type="button" class="home-bar-btn${activeTab === 'home' ? ' active' : ''}" onclick="gharSetTab('home')">
          <span class="tab-icon">🏠</span>Home
        </button>
        <button type="button" class="home-bar-btn${activeTab === 'settings' ? ' active' : ''}" onclick="gharSetTab('settings')">
          <span class="tab-icon">⚙️</span>Settings
        </button>
      </div>
    `;
  }

  // Dedicated page for ONE utility subtype (e.g. Electricity) — reached from its own Home/Settings tile.
  function renderUtilitySubtypePage(cat, st){
    const f = ensureUtilityForm(cat.id, st.id);
    const month = monthOf(f.date || todayStr());
    const entries = ensureUtilityEntries(cat.id, st.id);
    const total = Object.entries(entries).filter(([d]) => monthOf(d) === month).reduce((s,[,v]) => s + (Array.isArray(v) ? v.reduce((a,e)=>a+((e&&e.amount)||0),0) : 0), 0);
    const allDates = sortedDatesDesc(entries);
    const logMonth = f.logMonth || todayStr().slice(0,7);

    // Flatten {date: [entries]} into one row per entry, filtered to the selected log month
    const flatRows = [];
    allDates.forEach(d => {
      if(monthOf(d) !== logMonth) return;
      (entries[d] || []).forEach(rec => flatRows.push({ date: d, rec }));
    });

    // Outstanding (unpaid) entries across ALL months for this utility
    const outstanding = [];
    allDates.forEach(d => {
      (entries[d] || []).forEach(rec => {
        if(rec && !rec.paidDate) outstanding.push({ date: d, rec, status: billPaymentStatus(rec) });
      });
    });
    outstanding.sort((a,b) => {
      const ad = a.rec.dueDate || a.date, bd = b.rec.dueDate || b.date;
      return ad < bd ? -1 : 1;
    });
    const outstandingTotal = outstanding.reduce((s,o) => s + (o.rec.amount||0), 0);
    const overdueCount = outstanding.filter(o => o.status.key === 'overdue').length;

    return `
    <div class="section">
      <div class="section-head">
        <span class="dot" style="background:${cat.color}"></span>
        <h2>${st.icon||'🧾'} ${st.name}</h2>
        <span class="month-total">${money(total)} this month</span>
      </div>

      ${outstanding.length > 0 ? `
      <div class="card" style="border-color:${overdueCount > 0 ? 'var(--absent)' : 'var(--half)'}">
        <div class="section-head" style="margin-bottom:8px">
          <h2 style="font-size:14px">Unpaid</h2>
          <span class="month-total">${money(outstandingTotal)}${overdueCount > 0 ? ' · ' + overdueCount + ' overdue' : ''}</span>
        </div>
        <div class="log-list">
          ${outstanding.map(o => `
            <div class="log-row">
              <span class="log-date">${fmtDate(o.date)}</span>
              <span class="log-main">${money(o.rec.amount)}${o.rec.note ? ' &middot; ' + o.rec.note : ''}</span>
              <span class="log-chip" style="background:${o.status.color}">${o.status.label}</span>
              <div class="log-actions">
                <button class="icon-btn" onclick="gharUtilityMarkPaid('${cat.id}','${st.id}','${o.date}','${o.rec.id}')" title="Mark paid today">✓</button>
              </div>
            </div>`).join('')}
        </div>
      </div>` : ''}

      ${(st.provider || st.caNumber || st.meterNumber) ? `
      <div class="card">
        <div class="section-head" style="margin-bottom:8px">
          <h2 style="font-size:14px">Details</h2>
        </div>
        <div style="font-size:13px;color:var(--ink-soft);line-height:1.7">
          ${st.provider ? `<div>${st.provider}</div>` : ''}
          ${st.caNumber ? `<div>${(st.caNumberLabel||'CA number')}: ${st.caNumber}</div>` : ''}
          ${st.meterNumber ? `<div>${(st.meterNumberLabel||'Meter number')}: ${st.meterNumber}</div>` : ''}
        </div>
